[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini2fa"
version = "0.2.0"
description = "安全的本地 TOTP 双因素认证管理工具"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pyzbar>=0.1.9",
    "Pillow>=10.0.0",
    "cryptography>=41.0.0",
    "wcwidth>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/Duroxi/Mini2FA"
Repository = "https://github.com/Duroxi/Mini2FA"

[project.scripts]
mini2fa = "mini2fa._cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "qrcode[pil]"]

[tool.setuptools.packages.find]
where = ["src"]